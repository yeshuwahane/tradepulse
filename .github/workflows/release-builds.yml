name: Build & Publish Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. Android Build Job
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/*.apk release-assets/TradePulse-Android-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-asset
          path: release-assets/TradePulse-Android-debug.apk

  # =============================================================
  # 2. iOS Build Job (Simulator Build)
  # =============================================================
  build-ios:
    name: Build iOS App (.zip)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build iOS App for Simulator (Unsigned)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compress iOS .app into .zip for distribution
        run: |
          mkdir -p release-assets
          APP_PATH=$(find build/ios_derived/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          cd $(dirname "$APP_PATH")
          zip -r "$GITHUB_WORKSPACE/release-assets/TradePulse-iOS-Simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-asset
          path: release-assets/TradePulse-iOS-Simulator.zip

  # =============================================================
  # 3. GitHub Release Creation Job
  # =============================================================
  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android Asset
        uses: actions/download-artifact@v4
        with:
          name: android-release-asset
          path: release-files

      - name: Download iOS Asset
        uses: actions/download-artifact@v4
        with:
          name: ios-release-asset
          path: release-files

      - name: Generate Release Tag & Name
        id: release_info
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "TradePulse Build ${{ steps.release_info.outputs.tag }}"
          body: |
            ### 🚀 Automated Build Release (${{ steps.release_info.outputs.tag }})
            
            **Commit:** `${{ github.sha }}`
            
            #### 📦 Download Assets:
            - **Android:** `TradePulse-Android-debug.apk` (Install directly on any Android device or emulator)
            - **iOS:** `TradePulse-iOS-Simulator.zip` (Extract and drag-and-drop the `.app` into any Mac iOS Simulator)
          files: |
            release-files/TradePulse-Android-debug.apk
            release-files/TradePulse-iOS-Simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}