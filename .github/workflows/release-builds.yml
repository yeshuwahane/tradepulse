name: Build & Publish Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # =============================================================
  # 1. Build Android APK
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          cp androidApp/build/outputs/apk/debug/*.apk release-assets/TradePulse-Android-debug.apk

      - name: Upload Android Artifact (Internal)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-asset
          path: release-assets/TradePulse-Android-debug.apk

  # =============================================================
  # 2. Build iOS Simulator App (.zip)
  # =============================================================
  build-ios:
    name: Build iOS App (.zip)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build iOS App for Simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compress iOS .app into .zip
        run: |
          mkdir -p release-assets
          APP_PATH=$(find build/ios_derived/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          cd $(dirname "$APP_PATH")
          zip -r "$GITHUB_WORKSPACE/release-assets/TradePulse-iOS-Simulator.zip" "$(basename "$APP_PATH")"

      - name: Upload iOS Artifact (Internal)
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-asset
          path: release-assets/TradePulse-iOS-Simulator.zip

  # =============================================================
  # 3. Publish Directly to GitHub Releases
  # =============================================================
  publish-release:
    name: Publish to GitHub Releases
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-asset
          path: release-files

      - name: Download iOS Zip
        uses: actions/download-artifact@v4
        with:
          name: ios-release-asset
          path: release-files

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ "${{ github.event.inputs.version_name }}" != "" ]; then
            TAG="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "TradePulse ${{ steps.versioning.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 TradePulse Build (${{ steps.versioning.outputs.tag }})
            
            ### ⬇️ Downloads:
            - 🤖 **Android APK**: [`TradePulse-Android-debug.apk`](<https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.tag }}/TradePulse-Android-debug.apk>)
            - 🍏 **iOS Simulator (.zip)**: [`TradePulse-iOS-Simulator.zip`](<https://github.com/${{ github.repository }}/releases/download/${{ steps.versioning.outputs.tag }}/TradePulse-iOS-Simulator.zip>)
          files: |
            release-files/TradePulse-Android-debug.apk
            release-files/TradePulse-iOS-Simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}